<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} // {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
    <meta property="og:image" content="{{ '/wtf.png' | absolute_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    {% feed_meta %}
  </head>
  <body>
    <a class="skip-link" href="#main">skip to content</a>
    <div class="noise" aria-hidden="true"></div>
    <header class="topbar">
      <a class="wordmark" href="{{ '/' | relative_url }}">dropbear labs <span>// research</span></a>
      <nav aria-label="primary">
        <a href="{{ '/#notes' | relative_url }}">notes</a>
        <a href="{{ '/about/' | relative_url }}">about</a>
        <a href="https://slobberdog.fyi">slobberdog</a>
      </nav>
    </header>
    <main id="main">{{ content }}</main>
    <footer class="site-footer">
      <span>dropbear labs // brisbane-ish</span>
    </footer>
  </body>
</html>
