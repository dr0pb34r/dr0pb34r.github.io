---
layout: default
---
<article class="cyber-card" style="max-width: 900px; margin: 0 auto;">
  <header style="margin-bottom: 30px; border-bottom: 1px solid hsla(var(--neon-teal), 0.15); padding-bottom: 15px; text-align: center;">
    <div style="font-family: var(--font-mono); font-size: 0.8rem; color: hsl(var(--cyber-yellow)); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px;">
      🛠️ Lab Workshop Series
    </div>
    <h1 style="border: none; padding: 0; margin: 0; font-size: 2.5rem; text-shadow: var(--glow-teal);">
      {{ page.title }}
    </h1>
    {% if page.difficulty %}
      <div style="margin-top: 10px;">
        <span class="cyber-tag">Difficulty: {{ page.difficulty }}</span>
        {% if page.duration %}
          <span class="cyber-tag" style="background-color: hsla(var(--neon-teal), 0.1); color: hsl(var(--neon-teal)); border-color: hsla(var(--neon-teal), 0.2);">Time: {{ page.duration }}</span>
        {% endif %}
      </div>
    {% endif %}
  </header>

  <div class="workshop-content">
    {{ content }}
  </div>

  <footer style="margin-top: 40px; padding-top: 20px; border-top: 1px solid hsla(var(--neon-teal), 0.1); display: flex; justify-content: space-between;">
    <a href="/workshops/" class="btn btn-primary">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" style="vertical-align: middle; margin-right: 4px;">
        <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
      </svg>
      Back to Workshops Directory
    </a>
  </footer>
</article>
