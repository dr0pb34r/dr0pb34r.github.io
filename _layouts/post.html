---
layout: default
---
<article class="cyber-card" style="max-width: 850px; margin: 0 auto;">
  <header style="margin-bottom: 30px; border-bottom: 1px solid hsla(var(--neon-teal), 0.15); padding-bottom: 15px;">
    <div class="post-meta" style="margin-bottom: 10px;">
      <span>{{ page.date | date: "%B %d, %Y" }}</span>
      {% if page.category %}
        <span style="color: hsl(var(--neon-pink));">•</span>
        <span class="cyber-tag">{{ page.category }}</span>
      {% endif %}
      {% if page.status %}
        <span style="color: hsl(var(--neon-pink));">•</span>
        <span class="cyber-tag" style="background-color: hsla(var(--cyber-green), 0.15); color: hsl(var(--cyber-green)); border-color: hsla(var(--cyber-green), 0.3);">STATUS: {{ page.status }}</span>
      {% endif %}
    </div>
    
    <h1 style="border: none; padding: 0; margin: 0 0 10px; font-size: 2.5rem; text-shadow: var(--glow-teal); line-height: 1.2;">
      {{ page.title }}
    </h1>
  </header>
  
  <div class="post-content">
    {{ content }}
  </div>
  
  <footer style="margin-top: 40px; padding-top: 20px; border-top: 1px solid hsla(var(--neon-teal), 0.1); display: flex; justify-content: space-between;">
    <a href="/blog/" class="btn btn-primary">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" style="vertical-align: middle; margin-right: 4px;">
        <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
      </svg>
      Back to Field Notes
    </a>
  </footer>
</article>
