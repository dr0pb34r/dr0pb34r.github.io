---
layout: default
---
<article class="cyber-card" style="max-width: 800px; margin: 0 auto;">
  <header style="margin-bottom: 30px; border-bottom: 1px solid hsla(var(--neon-teal), 0.15); padding-bottom: 15px;">
    <h1 style="border: none; padding: 0; margin: 0; font-size: 2.2rem;">{{ page.title }}</h1>
    {% if page.subtitle %}
      <p style="font-family: var(--font-display); font-size: 0.95rem; color: hsl(var(--text-muted)); text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; margin-bottom: 0;">{{ page.subtitle }}</p>
    {% endif %}
  </header>
  
  <div class="page-content">
    {{ content }}
  </div>
</article>
